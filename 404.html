<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — Young Nexus</title>
<meta name="description" content="La página que buscás no existe o cambió de lugar.">
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/space-grotesk-var.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{font-family:'Space Grotesk'; font-style:normal; font-weight:300 700; font-display:swap; src:url(/fonts/space-grotesk-var.woff2) format('woff2');}
  @font-face{font-family:'Inter'; font-style:normal; font-weight:100 900; font-display:swap; src:url(/fonts/inter-var.woff2) format('woff2');}
  @font-face{font-family:'IBM Plex Mono'; font-style:normal; font-weight:400; font-display:swap; src:url(/fonts/ibm-plex-mono-400.woff2) format('woff2');}
  :root{--ink:#0A0A0F; --surface:#111119; --line:#2A2A3D; --text:#FFFFFF; --text-dim:#A0A0B0; --electric:#2BA8DC; --violet-text:#B07FD0;}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--ink); color:var(--text); font-family:'Inter', sans-serif; line-height:1.55; min-height:100vh; display:flex; flex-direction:column;}
  a{color:inherit; text-decoration:none;}
  header{padding:22px 16px; border-bottom:1px solid var(--line);}
  .logo{display:flex; align-items:center; gap:10px; font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:18px; max-width:1120px; margin:0 auto;}
  .logo img{height:26px; width:auto; display:block;}
  main{flex:1; display:flex; align-items:center; padding:64px 16px;}
  .box{max-width:620px; margin:0 auto; text-align:center;}
  .code{font-family:'IBM Plex Mono', monospace; color:var(--violet-text); font-size:14px; letter-spacing:.12em; margin-bottom:14px;}
  h1{font-family:'Space Grotesk', sans-serif; font-size:clamp(30px, 6vw, 46px); line-height:1.1; margin-bottom:16px;}
  p{color:var(--text-dim); font-size:16.5px; margin-bottom:30px;}
  .ctas{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
  .btn-primary{background:var(--electric); color:#001217; padding:14px 26px; border-radius:10px; font-weight:600; font-size:15px;}
  .btn-secondary{border:1px solid var(--line); padding:14px 26px; border-radius:10px; font-weight:500; font-size:15px;}
  .btn-primary:focus-visible, .btn-secondary:focus-visible{outline:2px solid var(--electric); outline-offset:3px;}
</style>
</head>
<body>
<header><a href="/" class="logo"><img src="/logo-56.webp" alt="" width="28" height="28" decoding="async">Young Nexus</a></header>
<main>
  <div class="box">
    <div class="code">ERROR 404</div>
    <h1>Esta página no existe o cambió de lugar</h1>
    <p>Puede que el enlace esté mal escrito o sea viejo. Lo que buscabas seguro está en el inicio.</p>
    <div class="ctas">
      <a href="/" class="btn-primary">Volver al inicio</a>
      <a href="/#contacto" class="btn-secondary">Pedir diagnóstico gratis</a>
    </div>
  </div>
</main>
</body>
</html>
